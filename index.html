<!doctype html>
<html>
  <head>
    <title>Dice Probability Visualizer</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Dice Probability Visualizer</h1>

    <p>
      This tool helps players understand which dice numbers appear most often
      when rolling two dice.
    </p>

    <h2>Best Settlement Numbers</h2>
    <div id="bestSpots"></div>

    <h2>Dice Probability Table</h2>

    <table id="probabilityTable">
      <tr>
        <th>Dice Number</th>
        <th>Probability</th>
      </tr>
    </table>

    <h2>Probability Chart</h2>
    <div id="chart"></div>

    <h2>Roll Dice</h2>
    <div id="diceArea">
      <div class="dice" id="die1">1</div>
      <div class="dice" id="die2">1</div>
    </div>

    <p id="rollResult">Click the button to roll the dice.</p>

    <button onclick="rollDiceOnce()">Roll Dice Once</button>

    <br /><br />

    <button onclick="simulateDice()">Simulate 1000 Dice Rolls</button>

    <h2>Simulation Results</h2>
    <div id="results"></div>

    <script src="script.js"></script>
  </body>
</html>
